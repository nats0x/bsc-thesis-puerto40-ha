args: -set device.scsi1.share-rw=on -set device.scsi2.share-rw=on -set device.scsi3.share-rw=on
scsihw: virtio-scsi-single
scsi1: local:120/vm-120-asm-ocr1.raw,backup=0,cache=none,serial=asm-ocr1,size=10G
scsi2: local:120/vm-120-asm-data1.raw,backup=0,cache=none,serial=asm-data1,size=30G
scsi3: local:120/vm-120-asm-fra1.raw,backup=0,cache=none,serial=asm-fra1,size=20G